name: Finalize crXte import

on:
  push:
    paths:
      - ".github/workflows/finalize-import.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm cleaned source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f pyproject.toml
          test -f uv.lock
          test -f README.md
          test -f src/x_media_downloader/app.py
          test -s src/x_media_downloader/assets/DejaVuSans.ttf
          test ! -e screenshots
          test ! -e -- '-.png'
          test ! -e .venv
          test ! -e __pycache__

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6

      - name: Install system dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install locked project environment
        run: uv sync --locked --all-extras --dev

      - name: Compile Python source
        run: uv run python -m compileall -q src

      - name: Run complete test suite
        run: uv run pytest -q

      - name: Install permanent CI workflow and remove import scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import
          rm -f IMPORT_STATUS.md IMPORT_FAILURE.md
          rm -f .github/workflows/audit-import.yml
          rm -f .github/workflows/test-drive-fetch.yml
          rm -f .github/workflows/import-clean-source.yml
          rm -f .github/workflows/import-clean-source-v2.yml
          rm -f .github/workflows/verify-repository.yml
          rm -f .github/workflows/finalize-import.yml
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - uses: astral-sh/setup-uv@v6
                - name: Install FFmpeg
                  run: sudo apt-get update && sudo apt-get install -y ffmpeg
                - name: Install locked environment
                  run: uv sync --locked --all-extras --dev
                - name: Compile Python source
                  run: uv run python -m compileall -q src
                - name: Run tests
                  run: uv run pytest -q
          YAML

      - name: Commit finalized repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: finalize verified crXte repository"
          git push
