name: Import verified clean source v3

on:
  push:
    paths:
      - ".github/workflows/import-clean-source-v3.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source archive through Google Drive client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet gdown
          gdown --fuzzy 'https://drive.google.com/file/d/1jEz1sC_R3qax4kLgXzvsD5_rHpvGAe7U/view?usp=sharing' \
            --output /tmp/crXte-clean-source.zip
          echo '801d74d8fc7048674c22db586f48e462a4072cea6a12001332d3c9cdc2c0ec50  /tmp/crXte-clean-source.zip' | sha256sum -c -
          unzip -t /tmp/crXte-clean-source.zip

      - name: Install verified source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import .github/workflows
          rm -f IMPORT_STATUS.md IMPORT_FAILURE.md
          mkdir -p /tmp/crxte-import
          unzip -q /tmp/crXte-clean-source.zip -d /tmp/crxte-import
          source_dir="$(find /tmp/crxte-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$source_dir"
          shopt -s dotglob nullglob
          cp -a "$source_dir"/* .
          test -f pyproject.toml
          test -f uv.lock
          test -f README.md
          test -f src/x_media_downloader/app.py
          test -s src/x_media_downloader/assets/DejaVuSans.ttf
          test ! -e screenshots
          test ! -e -- '-.png'

      - name: Add permanent CI workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - uses: astral-sh/setup-uv@v6
                - name: Install FFmpeg
                  run: sudo apt-get update && sudo apt-get install -y ffmpeg
                - name: Install locked environment
                  run: uv sync --locked --all-extras --dev
                - name: Compile Python source
                  run: uv run python -m compileall -q src
                - name: Run tests
                  run: uv run pytest -q
          YAML

      - name: Commit imported project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import verified crXte source"
          git push
