name: Import verified clean source v2

on:
  push:
    paths:
      - ".github/workflows/import-clean-source-v2.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://drive.usercontent.google.com/download?id=1jEz1sC_R3qax4kLgXzvsD5_rHpvGAe7U&export=download&confirm=t' \
            -o /tmp/crXte-clean-source.zip
          echo '801d74d8fc7048674c22db586f48e462a4072cea6a12001332d3c9cdc2c0ec50  /tmp/crXte-clean-source.zip' | sha256sum -c -
          unzip -t /tmp/crXte-clean-source.zip

      - name: Replace staging tree with verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import .github/workflows
          rm -f IMPORT_STATUS.md
          mkdir -p /tmp/crxte-import
          unzip -q /tmp/crXte-clean-source.zip -d /tmp/crxte-import
          source_dir="$(find /tmp/crxte-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$source_dir"
          shopt -s dotglob nullglob
          cp -a "$source_dir"/* .
          test -f pyproject.toml
          test -f uv.lock
          test -f src/x_media_downloader/app.py
          test -s src/x_media_downloader/assets/DejaVuSans.ttf
          test ! -e screenshots
          test ! -e -- '-.png'

      - name: Commit verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import verified crXte source"
          git push
