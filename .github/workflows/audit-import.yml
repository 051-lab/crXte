name: Audit staged import

on:
  push:
    paths:
      - ".github/workflows/audit-import.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report staged segment integrity
        shell: bash
        run: |
          set -euo pipefail
          : > .import/audit-report.txt
          for file in .import/part_*; do
            bytes="$(wc -c < "$file" | tr -d ' \n')"
            git_sha="$(git hash-object "$file")"
            sha256="$(sha256sum "$file" | cut -d' ' -f1)"
            printf '%s bytes=%s git=%s sha256=%s\n' "$file" "$bytes" "$git_sha" "$sha256" | tee -a .import/audit-report.txt
          done

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .import/audit-report.txt
          git commit -m "chore: record staged payload audit"
          git push
