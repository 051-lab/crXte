name: Audit staged import

on:
  push:
    paths:
      - ".github/workflows/audit-import.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate mismatched blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path('.import/block-hashes.json').read_text())
          block_size = manifest['block_size']
          report = {'block_size': block_size, 'parts': {}}
          for name, expected in manifest['parts'].items():
              path = Path('.import') / name
              data = path.read_bytes()
              actual_blocks = [
                  hashlib.sha256(data[offset:offset + block_size]).hexdigest()
                  for offset in range(0, len(data), block_size)
              ]
              expected_blocks = expected['blocks']
              mismatches = [
                  index
                  for index in range(max(len(actual_blocks), len(expected_blocks)))
                  if index >= len(actual_blocks)
                  or index >= len(expected_blocks)
                  or actual_blocks[index] != expected_blocks[index]
              ]
              report['parts'][name] = {
                  'actual_length': len(data),
                  'expected_length': expected['length'],
                  'actual_sha256': hashlib.sha256(data).hexdigest(),
                  'expected_sha256': expected['sha256'],
                  'mismatched_blocks': mismatches,
              }
          Path('.import/block-audit-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          print(Path('.import/block-audit-report.json').read_text())
          PY

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .import/block-audit-report.json
          git commit -m "chore: locate staged payload differences"
          git push
