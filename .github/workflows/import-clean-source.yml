name: Import verified clean source

on:
  push:
    paths:
      - ".github/workflows/import-clean-source.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify clean source
        id: verify
        shell: bash
        run: |
          set +e
          url='https://drive.usercontent.google.com/download?id=1jEz1sC_R3qax4kLgXzvsD5_rHpvGAe7U&export=download&confirm=t&uuid=2334420d-6f7b-4e03-a728-bc2f15b536fe'
          code="$(curl -L -sS -o /tmp/crXte-clean-source.zip -w '%{http_code}' "$url")"
          actual="$(sha256sum /tmp/crXte-clean-source.zip 2>/dev/null | cut -d' ' -f1)"
          size="$(wc -c < /tmp/crXte-clean-source.zip 2>/dev/null || echo 0)"
          expected='801d74d8fc7048674c22db586f48e462a4072cea6a12001332d3c9cdc2c0ec50'
          if [ "$code" != '200' ] || [ "$actual" != "$expected" ]; then
            printf 'http=%s\nsize=%s\nexpected=%s\nactual=%s\n' "$code" "$size" "$expected" "$actual" > .import/drive-import-failure.txt
            echo 'verified=false' >> "$GITHUB_OUTPUT"
          else
            echo 'verified=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Record failed verification
        if: steps.verify.outputs.verified != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .import/drive-import-failure.txt
          git commit -m "chore: record source archive verification failure"
          git push
          exit 1

      - name: Replace staging tree with source
        if: steps.verify.outputs.verified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import .github/workflows
          unzip -q /tmp/crXte-clean-source.zip -d /tmp/crxte-import
          shopt -s dotglob nullglob
          source_dir="$(find /tmp/crxte-import -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cp -a "$source_dir"/* .
          test -f pyproject.toml
          test -f uv.lock
          test -f src/x_media_downloader/app.py
          test -s src/x_media_downloader/assets/DejaVuSans.ttf

      - name: Commit imported source
        if: steps.verify.outputs.verified == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import verified crXte source"
          git push
