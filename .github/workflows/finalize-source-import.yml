name: Diagnose verified source import

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Print transfer checksums
        shell: bash
        run: |
          set -euo pipefail
          for path in .source-import/archive-*.b64; do
            printf '%s bytes=%s sha256=%s\n' "$path" "$(wc -c < "$path")" "$(sha256sum "$path" | awk '{print $1}')"
          done
          cat .source-import/archive-*.b64 > /tmp/crxte-source.b64
          printf 'combined-base64 bytes=%s sha256=%s\n' "$(wc -c < /tmp/crxte-source.b64)" "$(sha256sum /tmp/crxte-source.b64 | awk '{print $1}')"
          base64 --decode /tmp/crxte-source.b64 > /tmp/crxte-source.tar.xz
          printf 'archive bytes=%s sha256=%s\n' "$(wc -c < /tmp/crxte-source.tar.xz)" "$(sha256sum /tmp/crxte-source.tar.xz | awk '{print $1}')"
