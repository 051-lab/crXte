name: Test Drive source fetch

on:
  push:
    paths:
      - ".github/workflows/test-drive-fetch.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test download
        shell: bash
        run: |
          set +e
          url='https://drive.usercontent.google.com/download?id=1jEz1sC_R3qax4kLgXzvsD5_rHpvGAe7U&export=download&confirm=t&uuid=2334420d-6f7b-4e03-a728-bc2f15b536fe'
          code="$(curl -L -sS -o /tmp/source.bin -w '%{http_code}' "$url")"
          size="$(wc -c < /tmp/source.bin 2>/dev/null || echo 0)"
          sha="$(sha256sum /tmp/source.bin 2>/dev/null | cut -d' ' -f1)"
          file_type="$(file -b /tmp/source.bin 2>/dev/null || true)"
          printf 'http=%s\nsize=%s\nsha256=%s\ntype=%s\n' "$code" "$size" "$sha" "$file_type" > .import/drive-fetch-report.txt
          head -c 200 /tmp/source.bin | base64 >> .import/drive-fetch-report.txt

      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .import/drive-fetch-report.txt
          git commit -m "chore: record Drive fetch test"
          git push
