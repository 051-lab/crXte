name: Stage 0 plan correction

on:
  push:
    branches: [docs/stage0-plan-correction]

permissions:
  contents: write

jobs:
  correct-plan:
    if: github.repository == '051-lab/crXte'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v7

      - name: Correct setup-uv reference and remove this workflow
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/superpowers/plans/2026-08-06-stage-0-baseline-ci.md')
          text = path.read_text(encoding='utf-8')
          pattern = r'astral-sh/setup-uv@v9(?!\.0\.0)'
          matches = re.findall(pattern, text)
          if len(matches) != 2:
              raise SystemExit(f'expected 2 stale setup-uv references, found {len(matches)}')
          corrected = re.sub(pattern, 'astral-sh/setup-uv@v9.0.0', text)
          if re.search(pattern, corrected):
              raise SystemExit('stale setup-uv reference remains after correction')
          path.write_text(corrected, encoding='utf-8')
          PY

          rm .github/workflows/stage0-plan-correction.yml
          git diff --check
          git diff -- docs/superpowers/plans/2026-08-06-stage-0-baseline-ci.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/plans/2026-08-06-stage-0-baseline-ci.md .github/workflows/stage0-plan-correction.yml
          git commit -m 'docs: correct setup-uv release reference'
          git push origin HEAD:docs/stage0-plan-correction
