name: Phase 1 indentation correction

on:
  push:
    branches:
      - fix/article-markdown-entities

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/article-markdown-entities
      - name: Correct source and self-remove
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/x_media_downloader/article_html.py")
          source = path.read_text(encoding="utf-8")
          broken = '''        elif entity_type == "MARKDOWN":
    markdown = _string(data.get("markdown")).strip()
    lines = markdown.splitlines()
    if len(lines) >= 2 and lines[0].startswith("```") and lines[-1] == "```":
        code = "\\n".join(lines[1:-1])
        rendered.append(f"<pre><code>{escape(code)}</code></pre>")
elif entity_type == "MEDIA":
'''
          fixed = '''        elif entity_type == "MARKDOWN":
            markdown = _string(data.get("markdown")).strip()
            lines = markdown.splitlines()
            if len(lines) >= 2 and lines[0].startswith("```") and lines[-1] == "```":
                code = "\\n".join(lines[1:-1])
                rendered.append(f"<pre><code>{escape(code)}</code></pre>")
        elif entity_type == "MEDIA":
'''
          if source.count(broken) != 1:
              raise SystemExit(f"expected one broken branch; found {source.count(broken)}")
          path.write_text(source.replace(broken, fixed, 1), encoding="utf-8")
          PY
          rm .github/workflows/phase1-fix-indentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/x_media_downloader/article_html.py .github/workflows/phase1-fix-indentation.yml
          git commit -m "fix: correct Markdown entity renderer indentation"
          git push origin HEAD:fix/article-markdown-entities
