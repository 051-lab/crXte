[project]
name = "x-media-downloader"
version = "0.3.0"
description = "crXte: a local exporter for public X posts, articles, media, Markdown, and PDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.116,<1",
  "gallery-dl==1.32.6",
  "httpx>=0.28,<1",
  "platformdirs>=4.3,<5",
  "pypdf>=5.9,<7",
  "reportlab>=4.4,<5",
  "uvicorn[standard]>=0.35,<1",
  "yt-dlp>=2026.7.4",
]

[project.scripts]
x-media-downloader = "x_media_downloader.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x_media_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
